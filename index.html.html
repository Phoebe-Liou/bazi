<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>靈魂停看聽・命語🌙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：單欄問診單 → 四柱命盤 → 大運軸 → 問命理師；五行色只作語意標示 */
:root{
  --bg:#e9ede6; --paper:#f6f8f3; --ink:#1f2a24; --muted:#5b6a60; --line:#cbd4c8;
  --accent:#8a5a1c; --accent-ink:#fff8ec; --focus:#2f6b55;
  --wood:#3d7a3a; --fire:#b4382c; --earth:#9a6b1f; --metal:#6b6f78; --water:#24507a;
  --display:"LXGW WenKai TC","Kaiti TC","STKaiti","DFKai-SB",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a17; --paper:#1c2420; --ink:#e4ebe3; --muted:#9aa89d; --line:#34413a;
  --accent:#d9a55a; --accent-ink:#1b140a; --focus:#7cc3a6;
  --wood:#7fbf6e; --fire:#ec7a68; --earth:#d7a552; --metal:#b4b8c2; --water:#77a8d8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a17; --paper:#1c2420; --ink:#e4ebe3; --muted:#9aa89d; --line:#34413a;
  --accent:#d9a55a; --accent-ink:#1b140a; --focus:#7cc3a6;
  --wood:#7fbf6e; --fire:#ec7a68; --earth:#d7a552; --metal:#b4b8c2; --water:#77a8d8; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65;padding-inline:16px;padding-block:28px 64px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header h1{font-family:var(--display);font-size:2.4rem;line-height:1.1;margin:0;letter-spacing:.04em}
header p{margin:.4rem 0 0;color:var(--muted);max-width:34em}
section{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px}
h2{font-family:var(--display);font-size:1.35rem;margin:0 0 12px;font-weight:700;letter-spacing:.03em}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);font-weight:500}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px 10px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.seg{display:flex;gap:6px}
.seg label{flex:1;flex-direction:row;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:8px;color:var(--ink);cursor:pointer;font-size:.95rem}
.seg input{width:auto;accent-color:var(--accent)}
.check{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-weight:400;font-size:.9rem}
.check input{width:auto;accent-color:var(--accent)}
.hint{font-size:.8rem;color:var(--muted);margin:0}
.warn{color:var(--fire)}
.btn{font:inherit;font-weight:700;border:0;border-radius:8px;padding:11px 18px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
/* 命盤 */
.pillars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center}
.pcol{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:8px}
.pcol.me{background:var(--bg);outline:1px solid var(--line)}
.plabel{font-size:.75rem;color:var(--muted);letter-spacing:.12em}
.god{font-size:.8rem;font-weight:700;color:var(--muted);min-height:1.3em}
.char{font-family:var(--display);font-size:2.6rem;line-height:1.15;font-weight:700}
.hid{display:flex;flex-direction:column;gap:1px;font-size:.78rem;margin-top:4px;min-height:3.6em}
.hid span b{font-family:var(--display);font-size:.95rem;margin-right:2px}
.e0{color:var(--wood)}.e1{color:var(--fire)}.e2{color:var(--earth)}.e3{color:var(--metal)}.e4{color:var(--water)}
.meta{font-size:.82rem;color:var(--muted);margin-top:14px;display:flex;flex-direction:column;gap:2px}
.bars{display:grid;grid-template-columns:2.2em 1fr 2em;gap:6px 8px;align-items:center;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:5px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:currentColor}
.gods{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{font-size:.82rem;border:1px solid var(--line);border-radius:99px;padding:3px 10px;background:var(--bg)}
.chip b{font-variant-numeric:tabular-nums}
.yun{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.ycell{flex:0 0 auto;min-width:64px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:8px 6px;font-variant-numeric:tabular-nums}
.ycell.now{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.ycell .c{font-family:var(--display);font-size:1.4rem;font-weight:700;line-height:1.2}
.ycell small{display:block;color:var(--muted);font-size:.72rem}
.ycell .g{font-size:.72rem;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:5px 12px;cursor:pointer}
textarea{resize:vertical}
#prompt{font-size:.8rem;min-height:220px;font-family:ui-monospace,Menlo,monospace;line-height:1.5}
details summary{cursor:pointer;color:var(--muted);font-size:.88rem}
.toast{font-size:.88rem;color:var(--wood);font-weight:700}
#partnerBox .pillars .char{font-size:2rem}
.rel{display:flex;flex-direction:column;gap:4px;margin-top:12px;font-size:.9rem}
.rel b{color:var(--accent)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:560px){.two{grid-template-columns:minmax(0,1fr)}.char{font-size:2.1rem}header h1{font-size:2rem}}
@media (prefers-reduced-motion:no-preference){.btn{transition:transform .1s}.btn:active{transform:scale(.97)}}
</style>

<div class="wrap">
<header>
  <h1>靈魂停看聽・命語🌙</h1>
  <p>輸入國曆生日與出生地，自動以真太陽時排出四柱與大運。寫下你現在卡住的事，一鍵複製，貼給 AI 命理師看盤。</p>
</header>

<section aria-labelledby="h-in">
  <h2 id="h-in">生辰資料</h2>
  <form id="f" class="grid" novalidate>
    <label>稱呼（選填）<input id="name" placeholder="例：小美"></label>
    <div><span class="hint" style="display:block;margin-bottom:4px;font-weight:500">性別（排大運用）</span>
      <div class="seg"><label><input type="radio" name="sex" id="sexM" value="1" checked>男</label><label><input type="radio" name="sex" id="sexF" value="0">女</label></div></div>
    <label>國曆生日<input type="date" id="date" min="1900-01-01" max="2100-12-31" required></label>
    <label>出生時間（時鐘時間）<input type="time" id="time"></label>
    <label class="check full"><input type="checkbox" id="unknown">不知道出生時間（不排時柱）</label>
    <label class="full">出生地<select id="place"></select></label>
    <div id="custom" class="grid full" hidden>
      <label>經度（東經為正）<input type="number" id="clon" step="0.01" value="121.5"></label>
      <label>時區（UTC+）<input type="number" id="ctz" step="0.5" value="8"></label>
    </div>
    <label class="check full"><input type="checkbox" id="dst">出生當時實施夏令時間（日光節約，時鐘撥快一小時）</label>
    <p id="dstHint" class="hint warn full" hidden></p>
    <label class="full">晚子時（23:00–24:00）
      <select id="zi"><option value="1">23 點換日（日柱算隔天）</option><option value="0">24 點換日（日柱算當天）</option></select></label>
  </form>
</section>

<section aria-labelledby="h-chart">
  <h2 id="h-chart">命盤</h2>
  <p id="sample" class="hint" style="margin-bottom:10px">目前顯示的是範例生日，改成你的資料即可。</p>
  <div class="pillars" id="pillars"></div>
  <div class="meta" id="meta"></div>
  <div class="gods" id="gods"></div>
</section>

<div class="two">
<section aria-labelledby="h-el">
  <h2 id="h-el">五行分布</h2>
  <div class="bars" id="bars"></div>
  <p class="hint" style="margin-top:10px">只計天干與地支本氣，給 AI 參考用，旺衰請交給命理師判斷。</p>
</section>
<section aria-labelledby="h-yun">
  <h2 id="h-yun">大運</h2>
  <div class="yun" id="yun"></div>
  <p class="hint" id="yunNote" style="margin-top:8px"></p>
</section>
</div>

<section aria-labelledby="h-pt">
  <h2 id="h-pt">另一半（合盤）</h2>
  <label class="check"><input type="checkbox" id="pOn">加入另一半或心儀對象的生日，一起看你們怎麼相處</label>
  <div id="partnerBox" hidden style="margin-top:14px">
    <form id="pf" class="grid" novalidate>
      <label>對方稱呼（選填）<input id="pname" placeholder="例：阿哲"></label>
      <div><span class="hint" style="display:block;margin-bottom:4px;font-weight:500">對方性別</span>
        <div class="seg"><label><input type="radio" name="psex" id="psexM" value="1">男</label><label><input type="radio" name="psex" id="psexF" value="0" checked>女</label></div></div>
      <label>對方國曆生日<input type="date" id="pdate" min="1900-01-01" max="2100-12-31"></label>
      <label>對方出生時間<input type="time" id="ptime"></label>
      <label class="check full"><input type="checkbox" id="punknown">不知道對方出生時間</label>
      <label class="full">對方出生地<select id="pplace"></select></label>
    </form>
    <div class="pillars" id="ppillars" style="margin-top:16px"></div>
    <div class="meta" id="pmeta"></div>
    <div class="rel" id="rel"></div>
  </div>
</section>

<section aria-labelledby="h-ask">
  <h2 id="h-ask">問命理師</h2>
  <div class="chips" id="chips">
    <button type="button" data-q="我對工作方向很迷茫，不知道該留下還是換跑道，適合往哪裡走？">工作方向</button>
    <button type="button" data-q="感情上我一直卡住，我在關係裡是什麼樣的人？該怎麼調整？">感情</button>
    <button type="button" data-q="我在感情裡常被誤會成什麼樣子？我真正愛人的方式是什麼？適合什麼樣的另一半？">我的愛情說明書</button>
    <button type="button" data-q="我們兩個合不合？彼此在對方眼中是什麼角色？常會卡在哪裡、該怎麼相處？">我們合不合</button>
    <button type="button" data-q="我的感情什麼時候比較容易有好消息？未來幾年哪一年適合把握？">感情時機</button>
    <button type="button" data-q="我適合跟人合夥，還是自己做比較好？">合夥還是自己做</button>
    <button type="button" data-q="以我的命盤，平常生活可以怎麼養運？缺的五行要怎麼補？">怎麼養運</button>
    <button type="button" data-q="我的財庫在哪裡？什麼時候是我的財富窗口期？平常要怎麼守住錢？">財庫與窗口期</button>
    <button type="button" data-q="我的財運如何？適合用什麼方式賺錢、存錢？">財運</button>
    <button type="button" data-q="今年和明年對我來說是什麼樣的一年？要注意什麼、該把握什麼？">今明兩年</button>
    <button type="button" data-q="我常覺得沒人懂我、很孤單，我該怎麼跟自己相處？">跟自己相處</button>
  </div>
  <label style="margin-top:12px">你現在最迷茫的事<textarea id="q" rows="4" placeholder="越具體越好：發生了什麼、你卡在哪、想知道什麼。"></textarea></label>
  <div class="row" style="margin-top:14px">
    <button class="btn" type="button" id="copy">複製給 AI</button>
    <a class="btn ghost" href="https://claude.ai/new" target="_blank" rel="noopener">開啟 Claude</a>
    <a class="btn ghost" href="https://chatgpt.com/" target="_blank" rel="noopener">開啟 ChatGPT</a>
    <span class="toast" id="toast" role="status"></span>
  </div>
  <p class="hint" style="margin-top:8px">複製後到 AI 對話框貼上送出即可。想繼續追問，直接在同一個對話裡問。</p>
  <details style="margin-top:12px"><summary>查看要貼給 AI 的完整內容</summary>
    <textarea id="prompt" readonly style="margin-top:8px"></textarea></details>
</section>
</div>

<style id="the-unwritten-visual-only">

/* THE UNWRITTEN — 禪風視覺覆寫層。原有程式與表單結構完全不變。 */
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Great+Vibes&family=Noto+Serif+TC:wght@400;500;600;700&display=swap');
:root,:root[data-theme="light"]{
 --bg:#f4f1e9;--paper:#fffdf8;--ink:#34483f;--muted:#77847a;--line:#e3ddd0;
 --accent:#94774e;--accent-ink:#fffaf1;--focus:#597e70;
 --wood:#537f64;--fire:#b56d60;--earth:#aa8651;--metal:#7c8489;--water:#557c92;
 --display:"Noto Serif TC","LXGW WenKai TC",serif;
 --body:"DM Sans","Noto Sans TC","Microsoft JhengHei",sans-serif;
 color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#202823;--paper:#29332d;--ink:#eae6d9;--muted:#b2baae;--line:#455047;
 --accent:#c7ad80;--accent-ink:#242923;--focus:#a6c8b7;
 --wood:#9fc1a1;--fire:#d8958a;--earth:#d2b27b;--metal:#b4b9bd;--water:#9cb7c8;
}}
:root[data-theme="dark"]{
 --bg:#202823;--paper:#29332d;--ink:#eae6d9;--muted:#b2baae;--line:#455047;
 --accent:#c7ad80;--accent-ink:#242923;--focus:#a6c8b7;
 --wood:#9fc1a1;--fire:#d8958a;--earth:#d2b27b;--metal:#b4b9bd;--water:#9cb7c8;
}
html{scroll-behavior:smooth}
body{padding:0 20px 90px;background:var(--bg);font-size:15px;line-height:1.8;letter-spacing:.012em}
body::before{content:"";position:absolute;top:0;left:0;width:100%;height:510px;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(255,253,247,.1) 0%,var(--bg) 100%),url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%201440%20460%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22m%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%3Cstop%20stop-color%3D%22%23a5b0a9%22%20stop-opacity%3D%22.35%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23a5b0a9%22%20stop-opacity%3D%220%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Cpath%20d%3D%22M0%20350%20Q80%20260%20155%20295%20Q245%20160%20330%20270%20Q420%20220%20510%20340%20Q610%20270%20700%20330%20Q800%20195%20895%20285%20Q985%20170%201070%20300%20Q1190%20220%201270%20315%20Q1360%20200%201440%20295%20L1440%20460%20L0%20460Z%22%20fill%3D%22url%28%23m%29%22%2F%3E%3Cpath%20d%3D%22M0%20400%20Q110%20320%20220%20390%20Q350%20290%20460%20395%20Q580%20345%20720%20408%20Q820%20305%20920%20380%20Q1060%20300%201180%20390%20Q1300%20330%201440%20400%20L1440%20460%20L0%20460Z%22%20fill%3D%22%23879991%22%20opacity%3D%22.10%22%2F%3E%3C%2Fsvg%3E") center bottom/cover no-repeat;opacity:.85}
.wrap{max-width:1040px;gap:25px}
header{min-height:390px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:66px 20px 42px;position:relative}
header::before{content:"靈 魂 停 看 聽";font-family:var(--display);font-size:.79rem;letter-spacing:.45em;color:var(--muted);margin-bottom:16px}
header h1{font-size:0;line-height:1.2;letter-spacing:0;margin:0;color:var(--ink)}
header h1::before{content:"命 語";display:block;font-family:var(--display);font-size:clamp(3.4rem,9vw,5.8rem);font-weight:600;letter-spacing:.19em;margin-left:.19em;text-shadow:0 5px 25px rgba(126,112,84,.08)}
header h1::after{content:"The Unwritten";display:block;font-family:"Great Vibes","Brush Script MT",cursive;font-size:clamp(3.1rem,7.5vw,5.1rem);font-weight:400;letter-spacing:0;color:var(--accent);margin-top:8px;line-height:1.2}
header p{font-size:0;max-width:unset;margin:18px 0 0}
header p::before{content:"生辰是序章，人生由你續寫。";display:block;font-family:var(--display);font-size:1.05rem;letter-spacing:.2em;color:var(--ink)}
header p::after{content:"BAZI · THE ART OF UNDERSTANDING DESTINY";display:block;font-family:"DM Sans",sans-serif;font-size:.65rem;letter-spacing:.28em;color:var(--muted);margin-top:12px}
section{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:clamp(22px,3vw,34px);box-shadow:0 10px 34px rgba(57,68,54,.035)}
h2{font-size:1.32rem;font-weight:600;letter-spacing:.12em;display:flex;align-items:center;gap:12px;margin-bottom:21px}
h2::before{content:"";width:3px;height:1.1em;background:var(--accent);border-radius:8px;opacity:.7}
.grid{gap:16px 18px}
label{font-size:.85rem;gap:7px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:11px 13px;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(147,120,79,.1)}
.seg{gap:8px}.seg label{border-radius:9px;padding:10px;background:var(--bg)}
.seg label:has(input:checked){background:color-mix(in srgb,var(--accent) 11%,var(--paper));border-color:var(--accent)}
.btn{border-radius:9px;padding:12px 21px;letter-spacing:.07em;transition:filter .2s,transform .2s}
.btn:hover{filter:brightness(.94)}.btn.ghost{background:var(--paper)}
.pillars{gap:12px}.pcol{padding:20px 8px 16px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.pcol.me{background:color-mix(in srgb,var(--accent) 8%,var(--paper));outline:none;border-color:var(--accent)}
.plabel{letter-spacing:.2em}.god{margin-top:7px;font-size:.76rem}.char{font-size:clamp(2.1rem,5vw,3rem);line-height:1.4}
.hid{margin-top:10px;gap:4px}.meta{margin-top:19px;padding-top:15px;border-top:1px solid var(--line)}
.chip,.chips button{background:var(--bg);border-radius:999px;border-color:var(--line)}
.chips{gap:9px}.chips button{padding:7px 14px;transition:background .2s,border-color .2s}
.chips button:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--paper))}
.bar{height:9px;background:var(--bg)}.ycell{min-width:75px;border-radius:10px;background:var(--bg);padding:12px 9px}.ycell.now{background:color-mix(in srgb,var(--accent) 10%,var(--paper))}

  if(py.length&&ss.length){const t=touch(py,ss);out.push(`梟印奪食：偏印${t?'貼身':'未貼身'}；${has(/財/)?'有財星解救':'無財星解救'}；食神${r.str==='偏強'?'可能是用神':r.str==='偏弱'?'可能是忌神（奪食反而解脫）':'喜忌待定'}`);}
  const bj=Object.entries(r.tally).filter(([k])=>/比肩|劫財/.test(k)).reduce((a,[,v])=>a+v.t+v.h*.5,0),cai=Object.entries(r.tally).filter(([k])=>/財/.test(k)).reduce((a,[,v])=>a+v.t+v.h*.5,0);
  if(bj>=2.5&&cai>0&&r.str==='偏強')out.push(`比劫奪財的條件（身強比劫多${cai<=1.5?'、財弱':''}，合夥與借貸要謹慎）`);
  if(has(/七殺/)&&has(/食神/))out.push('有食神可制殺（看食神是否有力、制得適度）');
  if(has(/正官|七殺/)&&has(/印/))out.push('官殺與印同見（看官印/殺印相生中間這一步順不順、印有沒有被財破）');
  // 官殺混雜
  const pw=godPower(r);
  if(pw['正官']&&pw['七殺']){const weak=['正官','七殺'].filter(g=>pw[g].lvl==='弱'||pw[g].fu);
    out.push(`官殺混雜的條件：正官${pw['正官'].lvl}、七殺${pw['七殺'].lvl}；${has(/食神|傷官/)?'有食傷可制其一':'無食傷制'}；${has(/印/)?'有印可化':'無印化'}${weak.length?'；'+weak.join('、')+'力量弱或虛浮，影響有限':''}${!weak.length&&!has(/食神|傷官/)&&!has(/印/)?'（較可能真的成立，表現為內耗、兩套標準打架）':'（未必成立）'}`);}
  // 羊刃駕殺
  const REN={0:3,2:6,4:6,6:9,8:0};
  if(ds%2===0&&r.Mo.b===REN[ds]){const jt=r.P.some((p,i)=>p&&i!==2&&tenGod(ds,p.s)==='劫財');
    out.push(`羊刃格（${GAN[ds]}生${ZHI[r.Mo.b]}月${jt?'，劫財透干':'，劫財未透干（有些派別不算）'}）${pw['七殺']?`，見七殺（${pw['七殺'].lvl}）：具羊刃駕殺的條件，要刃殺相停、身強扛得住才成格`:'，未見七殺'}`);}
  return out;
}
// 十神「有沒有力」：透干＋通根最強，透干無根為虛浮，藏支看本氣/中氣/餘氣，月令本氣最重
function godPower(r){
  const ds=r.ds,P=r.P,res={};
  const elIn=(el)=>P.some(p=>p&&HIDE[p.b].some(h=>elOfGan(h)===el));
  P.forEach((p,i)=>{if(!p)return;
    if(i!==2){const g=tenGod(ds,p.s);const root=elIn(elOfGan(p.s));const o=res[g]=res[g]||{v:0,tou:0,fu:0,ling:0,cang:[]};o.v+=root?1.5:.5;o.tou++;if(!root)o.fu=1;}
    HIDE[p.b].forEach((h,j)=>{const g=tenGod(ds,h);const o=res[g]=res[g]||{v:0,tou:0,fu:0,ling:0,cang:[]};const w=(j===0?1:j===1?.5:.3)*(i===1?2:1);o.v+=w;if(i===1&&j===0)o.ling=1;o.cang.push(['本氣','中氣','餘氣'][j]);});
  });
  Object.values(res).forEach(o=>{if(o.tou&&o.cang.length)o.fu=0;o.lvl=o.v>=2.5||o.ling?'強':o.v>=1.2?'中':'弱';});
  return res;
}
function powerText(r){const pw=godPower(r);
  return ['比肩','劫財','食神','傷官','偏財','正財','七殺','正官','偏印','正印'].filter(g=>pw[g]).map(g=>{const o=pw[g];
    const d=[o.ling?'月令本氣':'',o.tou?(o.fu?'透干無根（虛浮）':'透干有根'):'只藏地支（'+[...new Set(o.cang)].join('、')+'）'].filter(Boolean).join('、');
    return `${g}${o.lvl}（${d}）`;}).join('；');}

function buildPrompt(){
  const {o,r,p}=last;
  const q=$('q').value.trim()||(p?'我們兩個合不合？彼此在對方眼中是什麼角色？常會卡在哪裡、該怎麼相處？':'我最近很迷茫，想知道自己是什麼樣的人、現在處在什麼階段、接下來該往哪裡走。');
  return `你是一位實戰經驗豐富、很懂人心的八字命理師。看過非常多人的命盤，也陪過很多人走過低潮。現在坐在你對面的人感到迷茫，他需要的不是一堂命理課，而是看懂自己，知道下一步怎麼走。

【說話原則】
1. 用簡單明白的白話，像一位可靠的長輩或朋友在聊天。術語能不用就不用；非用不可時，順手用一句白話說明。
2. 不要賣弄技巧：不堆格局名詞、不展示推算過程、不引古書。結論先講，理由一兩句帶過就好。
3. 不賣恐懼，也不說假話：命盤看到的困難和課題要誠實講清楚，不粉飾、不為了讓他開心硬說好話；但每說一個難處，就給他看得見的應對方法。只說命盤真正支持的事，不硬湊、不恐嚇、不宿命。命盤是天生的傾向，不是判決。看不準或資料不足就直說。
   絕不建議做法事、補財庫、買開運物或任何付費化解；有人這樣說，請他謹慎看待。
4. 每個判斷都要落到生活裡看得見的樣子：他可能常有的感受、在工作或關係裡常見的狀況，讓他讀了會覺得「對，就是我」。
5. 建議要具體、做得到，最好這個月就能開始。
6. 不做醫療、法律、投資的具體指示；不預言疾病、手術、血光、意外或親人健康出事，最多溫和提醒多照顧身體、多關心家人；不說「投資必虧」「一定有第三者」這種話。若他透露身心狀況很糟，溫柔地建議他找信任的人或專業協助。${o.unknown?'\n7. 時辰未知，時柱不論；與子女、晚年、內心深處相關的判斷要保守。':''}

【看盤方法】（你心裡要這樣看，但不用說給他聽）
・先看全局，再談十神：先判斷日主強弱與喜用忌神（月令最重要），再看五行流通、十神之間的生剋制化與格局，最後才套用下面的十神觀點。單一個字沒有吉凶，組合起來才定高低。
・同一個十神，喜忌不同結果就不同：財星在身強有根時是財富，身弱時反成壓力與奔波（財多身弱）；七殺有食神制或印星化，壓力會轉成魄力與權威，無制才是波折；印星是喜神時，讀書進修是助力，若是忌神，學歷越高反而越挑剔、越難親近伴侶（印克財），早點進社會歷練反而好。
・斷運四法則：①先分喜忌再斷吉凶：十神吉凶不看名字，只看對命格是幫助還是消耗；同樣是財星，身強發財、身弱破財；同樣是官星，身強升職、身弱壓力是非。②重組合不重單星：傷官見官、梟印奪食、比劫奪財都有觸發條件，不要看到名詞就下結論。③流年靠引動才應驗：流年和原局發生合、沖、刑、害、伏吟，事情才會落地；沒有引動只是氣場浮動，不要說得太重。④命理是趨勢不是定數：知運、改心、修德、慎行，就能趨吉避凶。
・「有沒有」和「有沒有力」要分開：天干與藏干出現就算有，但力量差很多。看力量四件事：月令本氣最大（不透也很強）；透干又通根最有力，只透不根叫虛浮，只藏不透看本氣或餘氣；有沒有被合、被沖；旁邊有沒有被制化（食神制、印化，七殺會溫和很多）。大運流年也會把藏著的十神引出來，所以有人某幾年特別有感。十神的典型描述，是那個十神有力又沒被制時最明顯，力量越大越像；力量弱就要說「有一點這樣的傾向」。網頁有計算各十神的力量。
・先天格局改不了，破格就是破格，要誠實；能動的是兩件事：運勢時機，和後天的做法。所以談格局一定要接著講「哪幾年會比較輕鬆」和「平常可以怎麼做」。
・凶格的真正條件：傷官見官要「傷官與正官緊貼交戰＋無財通關＋無印化解」三者齊全才算，隔位、有財通關、或傷官是用神就完全不凶。梟印奪食要「食神是用神＋偏印貼身強克＋無財星解救」三者齊全；若食神本來是忌神，被奪反而是解脫。網頁有自動檢查這些條件。
・官印要看中間的作用：正官為用，要看它有沒有做對事（比劫旺、需要約束時，官有根有力才有用；身已弱官又重，就要看有沒有印來承接）。印星得力要看有沒有根、能不能生身、有沒有被財破，而不是數有幾個印。官印相生是「官生印、印生身」，官強印接不住，或官弱印過重，都不能只憑官印齊全說好。七殺有制化分兩路：食神制殺（重點在食神有力、制得適度），印化殺（重點在印得用、路徑順）。
・三個容易看反的地方：傷官旺但身弱，可用印制傷生身（傷官配印），不能直接貼上「不服管」；財克印要克壞的是所需之印才叫壞，身強印重反而喜財來制印；比劫重而官殺能制，反而適合組織、管理，不能直接斷成「只能創業」。記住順序：先看命局需要什麼，再看誰在起作用，最後查這條關係有沒有被破壞。學業不只看印，身強喜食傷時，可從學習技術與表達去理解。
・判斷強弱三步：得令最重要（月令是否生扶日主），得地次之（地支有沒有根：本氣根最強、中氣次之、餘氣再次；日支最貼身，影響僅次於月令），得幫扶再次之（天干有無比劫印，月干、時干最直接）。

・合不合適合夥：不適合的三種：身強比劫為忌（一人做主最順，合夥容易理念相爭、錢沒賺到朋友也傷）；傷官旺又無制（想法多但很難遷就，容易長期爭吵）；身弱官殺重（自己已被壓力拖累，合夥會疊加責任與糾紛，容易被拖累背責）。適合合夥的：身弱喜比劫幫扶，或官印相生的格局，有夥伴互補資源、有人托舉，可以借力成事。命理的價值不是預判暴富，而是幫人守住本金。

・身弱的人（不分男女）在感情裡特別要選不消耗自己的人：身弱見官殺多，壓力容易來自親密關係，一段不適合的感情會掏空情緒、打亂生活。這時真正托住他的，常是比劫，也就是閨蜜、同窗、志同道合的朋友與同路人。可以提醒他不必急著向外界證明自己能戀愛成家，但不要叫他不要談戀愛，也不要用「業力」嚇他。

・殺印相生的三個條件：殺要夠旺（太弱起不到壓力變動力的效果）、印要貼身（月干、時干、日支，太遠來不及化）、身要能扛（日主有根）。不是有殺有印就算貴格。
・聰明的八字常見：官印相生或印星透出，學得快、抓得住重點、有自己的見解；木火通明，腦子快、表達好；金白水清，邏輯清楚、心思細膩；日坐七殺為用，遇事不慌、越複雜越能找到解法；身旺帶將星，專注有主見、能鑽研到底；金水食傷成格，悟性高、想法多、能把複雜的事講明白。但都要看身強身弱，不是見到金水就代表聰明。
・感受力強的人（癸水、乙木、丁火等陰干日主，或身弱食傷旺）：優勢是強感知力，但在低品質環境裡反成劣勢，越能感知別人的情緒越容易被牽扯、被推責任，想獨處保護自己還會被說不合群。建議他向上流動，換到能滋養自己的環境。乙木身強的人共情力太強，容易承接身邊人的情緒包袱：慈悲不等於要接管別人的課題，把能量留給同頻向上的人。
・值得深交的人：印星重最靠譜（心軟、包容、不玩套路，終身貴人型朋友）；正財旺最厚道（守信、踏實、不貪）；正官透干最端正（自律、有底線，能托舉你）；食神旺最治癒（樂觀通透，靠近他會越來越鬆弛）。
・五行怎麼補：補之前先弄清楚兩件事。第一，缺的那個五行對他是喜是忌：八字看的是格局與喜忌，有些格局缺某個五行反而是好的，硬補是自找罪受，所以只補喜用，不要看到缺什麼就補什麼。第二，要補的是狀態，顏色、飾品、改名這些外在調整效果有限。五行是五種狀態：木是向上生發，需要木就去生發破局、連結人脈，練毅力與短時間專注；火是向外擴散，需要火就曝光自己、創造被看見的機會，上台表達、主動社交、做讓心跳加速的事；土是向內兼容、承載轉化，需要土就把想法落地、說到做到，並找能穩定情緒的習慣（太極、書法、冥想）；金是收束決斷，需要金就練習切割消耗你的人事物、該出手時出手，有勝負的團體運動也有幫助；水是向下沉澱、沉得住氣又保有彈性，需要水就讓自己不要那麼固化僵化，多讀歷史哲學科學，看透本質。
・正官：在月柱容易在社會上擔任領導、有責任心；在日支有組織領導力。正官多的人愛操心、勞累，交友謹慎、朋友少而正派，太多會變得固執、凡事要求完美，一生重名譽地位。完全沒有正官的人不喜被約束、我行我素，較難嚴格要求自己。女命官星弱的人姻緣可能來得晚，要看大運，不必說得太絕對。
・比劫重的人好勝、愛比較、體力好，適合運動或競爭型的工作，跌倒了會再站起來。比肩比較單純，有主見又不激進，容易得到同輩幫助；劫財像鏡子裡的另一個自己，常覺得錢存不住、被很多手搶。劫財重的人錢是花出來、賺出來的，不是省出來的，花在能讓自己升級、讓更多人受益的地方，反而能賺得更多。
・十神像人的身體：比劫是眼睛（自信、怎麼看待競爭）；食傷是嘴巴（表達、行銷自己）；財星是手腳（勤快、執行力、錢袋深淺）；官殺是胃口（志氣與能扛多少）；印星是心（愛人之前先愛自己）。
・印星偏向忍耐、吸收；食傷偏向宣洩、輸出。兩者的平衡常是情緒問題的關鍵。
・偏印：最特別的十神。喜歡冷門、有難度的東西，能一個人鑽研很久；直覺準、會看人、也會記仇；常有說不出的孤獨感，未必是六親緣淺。功課是獨立堅強、不把自己關起來。
・七殺：正義感強，看不慣不公平，硬忍久了會內傷。帶七殺的人多半很能忍，外表風平浪靜，內心早已波濤洶湧；遭遇不公時不太為自己發聲，而是默默無聲地離開。功課是聰明地表達不滿、守住底線，但不失控。七殺有力又在年柱或月令的人，面對主管老闆可能有莫名的壓迫感和焦慮。
・傷官見官（成立時）：傷官是才華、「我知道怎麼做比較好」；正官是規矩、體制、打卡簽核。能力擺出來大家都服，說話方式和做事狀態卻讓人不敢恭維；換過幾份工作，原因多半是對上層不滿、不認同制度。古訣：傷官旺而無財印不能見官；財可化傷生官（傷官生財、財生官，通關）；印可制伏傷官（傷官配印）。後天化解：練印的「先想再說、先聽再說」，練財的「動手做，把才華先換成結果，再拿結果去談」。走印運比較願意先聽，走財運會先做出成績。能力一流、口才好，但情緒與狀態要留意。點破時要溫和，不要像在指責他（直接說他會跟主管衝突，他可能當場翻臉）。
・官殺混雜（成立時）：正官講道理、照 SOP；七殺直接、要你馬上交，就像頭上有兩個主管。成立要兩個都有力，沒有被制掉或合走、也沒有印化；其中一個虛浮無根，影響就很有限，查到兩個都有先不用緊張。真的成立的人最明顯是內耗：同一件事用兩套標準各想一遍，答案常相反，決定了還回頭想另一條路，職場上常被說想太多、容易自責。網路上「女生官殺混雜就是爛桃花、會離很多次婚」是跳太多步，感情要看全盤，絕不能這樣斷。調整：身強的人走食傷運去掉其一（去官留殺、去殺留官）會輕鬆；身弱的人靠印把壓力轉成資源，走印運會輕鬆。後天盡量選權責清楚的環境，懂得開口求助，不要一個人悶頭苦幹。
・羊刃駕殺：羊刃是陽日主氣最旺的月份（甲生卯月、丙戊生午月、庚生酉月、壬生子月，多數說法要天干透劫財），七殺就是制住這股刃的東西，像刀與握刀的手。成格要日主旺到扛得住七殺、刀跟手力量差不多（刃殺相停）；七殺太重是被壓著打，刃太重殺太輕是手握不住刀。表現：遇到壓力先想怎麼接，場面越亂越清楚，常出現在要拍板的位置，常被說太衝、太硬；太順太閒沒對手時反而煩躁苦悶，力氣容易轉成強勢急躁與控制欲。調整：這股力氣用在事上不要用在人上，幫它找個夠難的對手（有挑戰的專案、需長期練的運動、別人不想碰的麻煩事），最怕讓它閒著，刀會轉向伴侶、同事、家人。發脾氣前問自己：我想把事情解決，還是想贏過這個人？想解決就去衝，想贏人就先把話吞回去，出門打場球。羊刃駕殺的人不怕壓力大，怕沒事做。
・印旺為忌的人：印是輸入、接收、內化，過旺時腦袋一直轉，小事想成很多種可能，還沒發生就先擔心到睡不著，最常被說想太多。所以命盤很多印卻感覺不到貴人：貴人給了一兩次機會，他想太多沒行動，貴人就慢慢離開了。化解方向不是少想而是多做，越具體越好：①把想的寫下來或說出來，腦袋轉十圈不如寫成三行，很多擔心寫出來就站不住；②限制輸入，一件事最多問 1–2 個信任的人，問完就決定；③用身體去做，運動、把拖很久的小事收掉（財能壞印，這裡的財就是實際行動與結果），一件事真的做完了，腦袋才會安靜。
・劫財的日常樣子：朋友開口借錢很難說不，借出去很爽快，要不要得回來另一回事；朋友一通電話手邊事可以先放下，家人會唸怎麼對外人比對自己人好；不太甘願只領一份死薪水，常盤算還能多做什麼；到新環境很快混熟、稱兄道弟。劫財常被說是破財星，其實他們的錢很多花在人身上，人脈也是這樣養出來的。
・丁火（日主或盤中丁火有力）的日常樣子：剛認識話很少，熟了才講心裡話，常被說慢熟；對自己人很捨得，朋友隨口提過想吃什麼會記得帶給他；很在意禮貌，對方不說謝謝、講話沒分寸，嘴上不講心裡默默扣分；做決定前想很久，會比價、先問身邊的人；愛恨分明，被劃到另一邊就很難再回來；惹到丁火，反撲很猛烈。
・傷官：善溝通、點子多、懂趨勢、個性多變，容易因說話直而得罪人。功課是學會行銷自己。
・食神：細膩講究、重品質、慢工出細活，對吃與生活品味挑剔。功課是保持品質，不流於放縱。
・偏印＋食神：興趣特別而有深度，遇事冷靜、能旁觀；需要安靜、獨處、精進自己的空間，要照顧好自己的內在小孩。
・偏印＋七殺（同柱更明顯）：有一種不好惹的疏離氣場，其實冷面熱腸、很護自己人；格局大、人生戲多，但很累。
・偏印＋傷官：觀察力強又能帶動局面，容易成為看懂局勢、順勢出手的人。
・偏印、七殺、傷官集中在月、日、時柱：天生反骨，自己就是自己的老師，對他少下指導棋，多給選擇。
・劫財、傷官重：容易因自己的脾氣或衝動惹麻煩。
・正財重有進有出；偏財重開源節流；正官要表裡如一；七殺可以敢愛敢恨；正印要學會愛惜自己。
・壬水日主重自由、腦袋停不下來，土少的人往往坐不住辦公室；土多的人像被框住，有志向卻困在固定體制。癸水日主像雲與雨，善變難捉摸，也很會照顧、指點身邊的人。日支為辰的人通常把自由和興趣放第一。
・每個十神都有好壞兩面，要看他用在哪一面：比肩好是自信、壞是太自我；劫財好是會說、壞是愛鬥；食神好是懂品味、壞是太挑剔；傷官好是懂門路、壞是只想曝光；正財好是會存、壞是太摳；偏財好是會投資、壞是貪多；正官好是形象好、壞是推責任；七殺好是有魄力能經商、壞是硬撐面子；正印好是感性體貼、壞是聖母心；偏印好是有悟性、壞是傲嬌。
・印星是兩面刃：正印像媽媽，對在乎的人百般呵護，容易過度付出、玻璃心，功課是先愛自己、拒絕聖母心（日柱甲子、乙亥、戊午、己巳或日支本氣為正印者特別明顯）。偏印一旦討厭一個人就記仇、斬斷無謂社交，帶著高傲，專注在自己身上。
・正印、偏印、食神、七殺都多的人容易內耗：正印只對愛的人好、偏印只讓自己悟、食神挑剔又不擅表達（口是心非、嘴是對內用的）、七殺看起來兇但重義氣能扛事。提醒他別自找麻煩、別過度講義氣。
・偏印＋食神：學習效率高、看事通透，容易進入心流；怕吵、愛獨處、做好份內事；也容易被認為高傲、難懂，對聽不懂的人很不耐煩。建議他不必在意合不合群，專注精進、學習、享受，並遠離消耗自己的人。
・劫財用在工作上是社交力和說服力（業務、仲介、講師、命理師）；沒用在工作就變碎念、控制、愛吃醋。傷官用在事業上是行銷、曝光（自媒體、藝人、網紅、從政）；沒用在事業就愛吵、愛爭、唱反調。兩者若在日支（如日柱甲午、乙巳、丙午、丁巳、庚子、辛亥、壬子、癸亥），感情關係較不穩定。傷官、劫財多的人凡事都想反駁，最好給自己找件正事做。
・傷官的位置：在年干，想與眾不同、想出頭；在月干或時干，適合行銷、公關、能展現才華創意的工作；只藏在地支沒透出，容易覺得想做的不能做、想表現沒人懂，久了變得叛逆、負面。傷官多的人好動、學得快但專注力短，像電池隨時滿電又想放電；癸水日主再配滿傷官，更容易分心、忘東忘西。這只能說是性格傾向，不可當成醫療診斷；若他本身困擾，建議找專業評估。
・常見強力組合：偏印＋食神，想學什麼都不難，聰明而自負，但偏印太重會壓制食神（梟印奪食），反而卡住表達與享受；偏印＋七殺，很能隔絕爛人爛事，臉常被當臭臉，生人勿近；比肩＋食神，獨處自在、做自己開心就好，不在意別人怎麼看；偏印＋偏財，看標的的眼光好，適合研究型投資，弱點是漲跌時抱不住；七殺＋偏財，天生創業家格局，忙碌、志向大，很難長期在別人底下做事。
・十神的使用方式（給建議時可直接用）：比肩用來增強自信，劫財用在社交人脈；食神用在內省學習，傷官用在工作手段；正財用在務實本業，偏財用在可控風險；正官用在紀律原則，七殺用在創業生意；正印的愛用在愛的人身上，偏印的傲用來提升自己。
・各十神的生活樣貌（可用來舉例讓他有共鳴）：比肩想吃什麼就吃；劫財覺得人多才熱鬧；食神相信自己點的最好吃；傷官吃前先拍照分享；正財嫌太貴要省；偏財大方請客；正官要體面的地方；七殺只要好吃就好；正印等大家到齊才動筷；偏印嫌吵想換桌。
